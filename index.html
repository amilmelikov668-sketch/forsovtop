
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>Forsov Game Mobile</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">F</div>
    <div class="user" id="userChip">Loading...</div>
    <button id="themeToggle">🌓</button>
  </header>

  <section class="balance-card">
    <div class="bal">Баланс: <span id="balance">0.00</span> M</div>
    <div class="stats">
      <div>Игр: <span id="games">0</span></div>
      <div>Выиграно: <span id="won">0.00</span></div>
      <div>Проиграно: <span id="lost">0.00</span></div>
    </div>
  </section>

  <section class="controls">
    <label>Ставка</label>
    <input id="amount" type="number" value="10"/>
    <label>Бомбы</label>
    <select id="bombs">
      <option value="3">3</option>
      <option value="5">5</option>
      <option value="8">8</option>
    </select>
    <button id="playBtn" class="play">Играть 🚀</button>

    <div class="result">
      Win: <span id="lastWin">0.00</span> | X <span id="lastMult">1.00</span>
    </div>
  </section>

  <section class="grid" id="grid"></section>

</div>
<script src="script.js"></script>
</body>
</html>
